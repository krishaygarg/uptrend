name: UpTrend Daily 8 AM Pacific Auto-Trader

on:
  schedule:
    # 15:00 UTC = 8:00 AM PDT (Monday-Friday)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily UpTrend Auto-Rebalancer & Trade Execution
        run: |
          python daily_rebalance.py --apply

      - name: Build Production Frontend UI
        run: |
          npm install
          npm run build

      - name: Commit & Push Updated Portfolio Valuation & UI Bundle
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Auto-Trader"
          git add portfolio.json public/ dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "UpTrend Auto-Trader Daily Execution [$(date +'%Y-%m-%d')]" && git push)
